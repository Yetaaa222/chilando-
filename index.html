<style>
:root{--bg:#ffffff;--bg2:#f5f5f5;--ink:#262626;--mute:#6b6b6b;--line:#e3e3e3;--ph:#ececec;
--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif}
:root[data-theme=dark]{--bg:#1d1d1c;--bg2:#262625;--ink:#efebe3;--mute:#a09b92;--line:#3a3935;--ph:#34332f}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(5rem + env(safe-area-inset-top,0px))}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(2.8rem,8vw,6rem)}h2{font-size:clamp(2rem,4.5vw,3.2rem)}
p{margin:0 0 1em;max-width:62ch}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(1.25rem,4vw,3rem)}
section{padding:clamp(4rem,10vw,8rem) 0}
.muted{color:var(--mute)}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:4.5rem}
.mark{font:500 1.35rem var(--serif);text-decoration:none;letter-spacing:.01em}
nav ul{display:flex;gap:2rem;list-style:none;margin:0;padding:0;align-items:center}
nav a{text-decoration:none;font-size:.9rem;padding:.4rem 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current=page]{border-color:var(--ink)}
nav .contact{border:1px solid var(--ink);padding:.4rem 1rem}
nav .contact:hover{background:var(--ink);color:var(--bg)}
#menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);padding:.5rem .9rem;font:inherit;font-size:.9rem;min-height:44px;cursor:pointer}
@media(max-width:760px){#menu{display:block}
nav ul{display:none;position:absolute;left:0;right:0;top:4.5rem;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;padding:1rem clamp(1.25rem,4vw,3rem);border-bottom:1px solid var(--line)}
nav ul.open{display:flex}nav li a{display:block;padding:.9rem 0}nav .contact{border:0;border-bottom:1px solid transparent;padding:.9rem 0}}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:.9rem 1.8rem;text-decoration:none;font-size:.95rem;border:1px solid var(--ink);cursor:pointer;font-family:var(--sans)}
.btn:hover{background:transparent;color:var(--ink)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.tlink{font-size:.95rem;margin-left:1.5rem;display:inline-block;padding:.9rem 0}
.art{position:relative;width:100%;background:var(--ph);overflow:hidden}
.art img{display:block;width:100%;height:100%;object-fit:contain}
.art.has-img{background:none}
main .art.has-img{aspect-ratio:auto!important}main .art.has-img img{height:auto}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.8rem;text-align:center;padding:1rem}
.hero{position:relative;padding:0;min-height:min(86vh,52rem);display:grid;place-items:center;color:#fff;background:var(--ph);overflow:hidden}
.herobg{position:absolute;inset:0}.herobg img{display:block;width:100%;height:100%;object-fit:cover}.herobg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.42)}
.herocopy{position:relative;text-align:center;padding:6rem clamp(1.25rem,4vw,3rem);max-width:62rem}
.herocopy h1{font-weight:500;text-shadow:0 1px 18px rgba(0,0,0,.35)}.herocopy p{margin:1.2rem auto 2rem;max-width:42ch;font-size:1.1rem}
.hero .btn{background:transparent;color:#fff;border-color:#fff}.hero .btn:hover{background:#fff;color:#262626}.hero .tlink{color:#fff}
.hero-copy{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem 4rem;padding:3rem 0 0;align-items:end}
@media(max-width:860px){.hero-copy,.split{grid-template-columns:1fr!important}}
.grid{columns:3 280px;column-gap:clamp(1.5rem,3vw,3rem);margin-top:3rem}
.item{break-inside:avoid;margin-bottom:clamp(2rem,4vw,3.5rem)}
.item button{all:unset;display:block;width:100%;cursor:zoom-in}
.item button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.cap{display:flex;justify-content:space-between;gap:1rem;padding-top:.7rem;font-size:.9rem}
.cap strong{font:400 1.2rem var(--serif)}
.split{display:grid;grid-template-columns:1fr 1.3fr;gap:3rem 5rem;align-items:start}
.alt{background:var(--bg2)}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}
.filters button{background:none;border:1px solid var(--line);color:var(--ink);padding:.5rem 1rem;font:inherit;font-size:.85rem;cursor:pointer;min-height:44px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.empty{border:1px dashed var(--line);padding:4rem 1rem;text-align:center;margin-top:3rem}
.note{font-size:.8rem;color:var(--mute);border-left:2px solid var(--line);padding-left:.8rem;margin-top:1.5rem}
footer{border-top:1px solid var(--line);padding:3rem 0;font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;gap:1.5rem 3rem;justify-content:space-between}
footer ul{list-style:none;display:flex;gap:1.5rem;padding:0;margin:0;flex-wrap:wrap}
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:100%;max-width:100vw;height:100%;max-height:100vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.lb{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(16rem,1fr);height:100%}
.lb .stage{padding:4.5rem 2rem 2rem;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.lb .stage .art{background:var(--ph);max-height:100%;width:auto;max-width:100%}
.lb aside{padding:4.5rem 2rem 2rem;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:.4rem}
.lb dl{margin:1rem 0;display:grid;grid-template-columns:auto 1fr;gap:.4rem 1.2rem;font-size:.9rem}.lb dt{color:var(--mute)}.lb dd{margin:0}
.lbtn{background:none;border:1px solid var(--line);color:var(--ink);padding:.6rem 1rem;font:inherit;font-size:.9rem;cursor:pointer;min-height:44px}
.lbtn:hover{border-color:var(--ink)}
#tt{position:relative;flex:none;width:58px;height:30px;padding:0;border:1px solid var(--line);border-radius:99px;background:var(--bg2);color:var(--mute);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .4s,border-color .4s}
#tt::after{content:"";position:absolute;inset:-8px -4px}
#tt svg{position:absolute;top:6px;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tt .sun{left:7px}#tt .moon{right:7px}
#tt .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .5s cubic-bezier(.65,0,.35,1),background .4s}
#tt[aria-checked=true] .knob{transform:translateX(28px)}
#tt:hover{border-color:var(--ink)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media(prefers-reduced-motion:reduce){#tt,#tt .knob{transition:none}}
.close{position:absolute;top:calc(1rem + env(safe-area-inset-top,0px));right:1.2rem}
.navs{display:flex;gap:.6rem;margin-top:auto;padding-top:1.5rem}
@media(max-width:860px){.lb{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.lb .stage{padding:4rem 1rem 1rem}.lb aside{border:0;border-top:1px solid var(--line);padding:1rem;max-height:40vh}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:no-preference){main{animation:in .5s ease}@keyframes in{from{opacity:0}}}
</style>
</head>

<header><div class="wrap">
<a class="mark" href="#/">Chilando Kapatamoyo Vera</a>

</div></header>
<main id="main" tabindex="-1"></main>
<footer><div class="wrap">
<div><div class="mark">Chilando Kapatamoyo Vera</div><p class="muted" id="copy"></p></div>
<ul id="flinks"></ul>
</div></footer>
<dialog id="lb" aria-label="Artwork detail"></dialog>

<script>
/* ===== EDIT CONTENT HERE ===== */
const SITE = {
  name: "Chilando Kapatamoyo Vera",
  tagline: "An emerging artist exploring creativity, expression, and the beauty of seeing the world differently.", // temporary copy
  sample: true,              // set to false once real content is in
  email: "chilandokaps@gmail.com", // SAMPLE address. Replace with her real email.
  socials: [{label:"Instagram", url:"https://www.instagram.com/samaraijane_/"}], // SAMPLE links. Replace with her real profiles.
  portrait: "chichi.jpeg",   // SAMPLE image. Replace with a URL to her portrait
  hero: sample(5,16,10),     // SAMPLE image. Replace with a URL to a real artwork
  heroRatio: [16,10],
  studio: [{src:sample(7,4,5),alt:"Sample studio photo",w:4,h:5},{src:sample(8,3,2),alt:"Sample sketchbook photo",w:3,h:2},{src:sample(9,1,1),alt:"Sample work in progress",w:1,h:1}], // SAMPLE images
intro: "I am a self-taught visual artist and curator from Zambia. My work explores African spirituality, women's stories and Zambian history through minimalist and abstract figurative forms.",

bio: ["I am a self-taught visual artist and curator passionate about exploring minimalist or abstract figurative and modern African art. My work focuses on African spirituality, women's stories and Zambian history, and I enjoy creating pieces that engage viewers on a personal and emotional level.", "Beyond my artistic endeavours, I am also a passionate advocate for cultural preservation and education. As I continue my journey as an aspiring artist, I remain guided by my unwavering love for Zambia, and I am determined to leave a lasting legacy that honours its rich cultural tapestry."],

practice: "My work begins with stories: the spiritual traditions of Africa, the lives and voices of women, and the history of Zambia. I draw on modern African art and work in a minimalist and abstract figurative style, keeping only what a piece needs to carry its meaning. I want each work to reach the viewer personally and emotionally, so that they feel something and are invited to reflect, remember and ask questions. As a curator, I also think about how a work sits among others and how people encounter it, and that shapes how I make it.",

journey: "I am self-taught, and my path has been one of learning by doing: looking closely, experimenting, and slowly finding my own artistic voice. I see myself as an aspiring artist at the start of a long journey. Alongside making art, I care about cultural preservation and education, and I want my work to help keep Zambia's heritage visible and valued. My hope is to build a body of work that honours that heritage and leaves a lasting legacy."
};
/* Artworks: add {title, year, medium, dimensions, description, status, category, src, srcset, w, h}.
   Leave src empty to show a placeholder. Only supplied fields are displayed. */
/* Generates abstract SAMPLE images so the layout can be previewed. Not real artwork. */
function sample(n,w,h){
  const P=[["#c9553d","#e8b04a","#2f4858"],["#3b5b7a","#d9c7a3","#a23b3b"],["#5d7a5a","#e3d3b0","#1f2a30"],["#b8876b","#40302c","#e9dcc6"],["#7a5c8a","#f0cf8f","#27374d"]][n%5];
  let s=n*9301+49297;const r=()=>(s=(s*9301+49297)%233280)/233280;
  const W=w*100,H=h*100;let g=`<rect width="${W}" height="${H}" fill="${P[2]}"/>`;
  for(let i=0;i<6;i++){const c=P[Math.floor(r()*2)],o=(.45+r()*.5).toFixed(2);
    g+=r()>.5?`<circle cx="${r()*W}" cy="${r()*H}" r="${(.12+r()*.28)*Math.min(W,H)}" fill="${c}" opacity="${o}"/>`:`<rect x="${r()*W*.7}" y="${r()*H*.7}" width="${(.2+r()*.4)*W}" height="${(.2+r()*.4)*H}" fill="${c}" opacity="${o}"/>`}
  g+=`<path d="M0 ${H*(.3+r()*.4)} Q ${W/2} ${H*r()} ${W} ${H*(.3+r()*.4)}" stroke="#f6f2ea" stroke-width="${Math.max(W,H)/90}" fill="none"/>`;
  return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${g}</svg>`);
}
const ART = [
  {title:"The Ritual 2",year:"2026",medium:"Sample medium",dimensions:"100 cm x 80 cm",description:"Sample description. Replace with a sentence or two about the piece.",status:"Available",category:"Painting",src:"art1.jpeg",alt:"Sample abstract artwork",w:4,h:5,placeholder:true},
  {title:"Kwa Kapeshsa 2",year:"2026",medium:"Sample medium",dimensions:"100 cm x 80 cm",status:"Enquire",category:"Drawing",src:"art4.jpeg",alt:"Sample abstract artwork",w:2.4,h:1.9,placeholder:true},
  {title:"Ba Mayo",year:"2025",medium:"Sample medium",dimensions:"50 cm × 50 cm",category:"Painting",src:"art3.jpeg",alt:"Sample abstract artwork",w:1,h:1,placeholder:true},
  {title:"The Ritual 1",year:"2025",medium:"Sample medium",dimensions: "100 cm x 80 cm", category:"Mixed media",src:"art2.jpeg",alt:"Sample abstract artwork",w:2.3,h:2.9,placeholder:true},
  {title:"The Hibicus Lady",year:"2025",medium:"Sample medium",dimensions:"50 cm × 50 cm",description:"Sample description for the detail view.",status:"Sold",category:"Drawing",src:"art7.jpeg",alt:"Sample abstract artwork",w:4,h:4,placeholder:true},
  {title:"Icishima (The Well)",year:"2024",medium:"Sample medium",dimensions: "100 cm x 80 cm",category:"Mixed media",src:"art6.jpeg",alt:"Sample abstract artwork",w:3.8,h:3,placeholder:true}
];
/* ============================= */
const $=(s,r=document)=>r.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=$("#main"); let filter="All", last=null, idx=0, list=[];

function artBox(a,{eager=false,sizes="(min-width:900px) 33vw, 90vw"}={}){
  const r=`aspect-ratio:${a.w}/${a.h}`;
  if(a.src) return `<div class="art has-img" style="${r}"><img src="${esc(a.src)}" ${a.srcset?`srcset="${esc(a.srcset)}" sizes="${sizes}"`:""} alt="${esc(a.alt||a.title||"Artwork")}" width="${a.w*100}" height="${a.h*100}" ${eager?'fetchpriority="high"':'loading="lazy" decoding="async"'}></div>`;
  return `<div class="art" style="${r}" role="img" aria-label="Placeholder image for ${esc(a.title||"artwork")}"><span class="ph">Placeholder<br>Replace with artwork</span></div>`;
}
function tile(a,i){return `<figure class="item" style="margin-inline:0"><button data-open="${i}" aria-label="View ${esc(a.title||"artwork")} larger">${artBox(a)}</button><figcaption class="cap"><strong>${esc(a.title||"Untitled")}</strong><span class="muted">${esc(a.year||"")}</span></figcaption></figure>`}
function cta(){
  return SITE.email?`<a class="btn" href="mailto:${esc(SITE.email)}">Get in Touch</a>`:`<span class="btn" role="link" aria-disabled="true">Get in Touch</span><p class="note">Contact email not yet added. Set <code>SITE.email</code> to enable this button.</p>`;
}
function contact(){
  const soc=SITE.socials.map(s=>`<a href="${esc(s.url)}" rel="noopener" target="_blank">${esc(s.label)}</a>`).join(" &nbsp; ");
  return `<section id="contact" class="alt"><div class="wrap split"><div><h2>Let’s Connect</h2></div><div><p>Get in touch about her artwork, commissions, collaborations, or other opportunities.</p>${SITE.email?`<p><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></p>`:""}${soc?`<p>${soc}</p>`:""}${cta()}</div></div></section>`;
}
function home(){
  const hero=SITE.hero?{src:SITE.hero,w:SITE.heroRatio[0],h:SITE.heroRatio[1],alt:"Featured artwork"}:{w:16,h:10,title:"hero artwork"};
  list=ART; const sel=ART.slice(0,6);
  return `<section class="hero"><div class="herobg">${SITE.hero?`<img src="${esc(SITE.hero)}" alt="" fetchpriority="high">`:""}</div>
  <div class="herocopy"><h1>${esc(SITE.name)}</h1><p>${esc(SITE.tagline)}</p><div><a class="btn" href="#/gallery">Explore My Work</a><a class="tlink" href="#/about">Get to Know Me</a></div></div>
  </section>${SITE.hero&&!SITE.sample?"":'<div class="wrap"><p class="note">Sample hero image, not real artwork. Replace it via <code>SITE.hero</code>.</p></div>'}
  <section><div class="wrap"><h2>Selected Works</h2>${sel.length?`<div class="grid">${sel.map((a,i)=>tile(a,i)).join("")}</div><a class="btn" href="#/gallery">View All Artwork</a>`:empty()}</div></section>
  <section class="alt"><div class="wrap split"><div>${SITE.portrait?artBox({src:"chichi.jpeg",w:4,h:5,alt:"Portrait of Chilando"},{}):artBox({w:4,h:5,title:"portrait"})}</div><div><h2>Meet the artist</h2><p style="margin-top:1.5rem">${esc(SITE.intro)}</p><a href="#/about">Read more about Chilando</a></div></div></section>${contact()}`;
}
function empty(){return `<div class="empty"><h3>New work is on the way</h3><p style="margin:.5rem auto" class="muted">Artworks will appear here as soon as they are added.</p></div>`}
function gallery(){
  const cats=[...new Set(ART.map(a=>a.category).filter(Boolean))];
  list=ART.filter(a=>filter==="All"||a.category===filter);
  return `<section><div class="wrap"><h1>The Gallery</h1><p class="muted" style="margin-top:1.5rem">A collection of works, ideas, and creative explorations.</p>
  ${list.length?`<div class="grid">${list.map((a,i)=>tile(a,i)).join("")}</div>`:empty()}
  ${ART.some(a=>a.placeholder)?'':""}</div></section>`;
}
function about(){
  const st=SITE.studio.length?`<section><div class="wrap"><h2>In the studio</h2><div class="grid">${SITE.studio.map(s=>`<figure class="item" style="margin-inline:0">${artBox(s)}</figure>`).join("")}</div></div></section>`:"";
  return `<section><div class="wrap split"><div>${SITE.portrait?artBox({src:"chilandoo.png",w:3.5,h:5,alt:"Portrait of Chilando"},{eager:true}):artBox({w:4,h:5,title:"portrait"})}</div><div><h1>About the Artist</h1><p class="muted" style="font:400 1.6rem var(--serif);margin-top:1rem">${esc(SITE.name)}</p></div></div></section>
  <section class="alt"><div class="wrap split"><h2>Biography</h2><div>${SITE.bio.map(p=>`<p>${esc(p)}</p>`).join("")}</div></div></section>
  <section><div class="wrap split"><h2>My Creative Practice</h2><p>${esc(SITE.practice)}</p></div></section>
  <section class="alt"><div class="wrap split"><h2>The Journey So Far</h2><p>${esc(SITE.journey)}</p></div></section>${st}
  <section><div class="wrap"><h2>Continue</h2><p style="margin-top:1.5rem" class="muted">See the work, or say hello.</p><a class="btn" href="#/gallery">Visit the Gallery</a><a class="tlink" href="#/contact">Get in touch</a></div></section>`;
}
function nf(){return `<section><div class="wrap"><h1>Page not found</h1><p style="margin-top:1.5rem" class="muted">This page doesn’t exist or has moved.</p><a class="btn" href="#/">Back to Home</a></div></section>`}

function route(){
  const h=location.hash.replace(/^#\/?/,"").split("?")[0]||"home"; const k=h==="contact"?"home":h;
  const v={home,about,gallery}[k];
  main.innerHTML=v?v():nf();
  const titles={home:"",about:"About | ",gallery:"Gallery | "};
  document.title=(v?titles[k]:"Page not found | ")+SITE.name+(v&&k==="home"?" | Visual Artist":"");
  document.querySelectorAll("nav a[data-r]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.r===k)||a.removeAttribute("aria-current"));
  document.querySelectorAll("nav a[data-r]").forEach(a=>{if(a.dataset.r===k)a.setAttribute("aria-current","page")});
  $("#nav-list").classList.remove("open");$("#menu").setAttribute("aria-expanded","false");
  if(h==="contact")setTimeout(()=>$("#contact")?.scrollIntoView(),0); else window.scrollTo(0,0);
}
/* Lightbox */
const lb=$("#lb");
function show(i){
  idx=(i+list.length)%list.length; const a=list[idx];
  const rows=[["Year",a.year],["Medium",a.medium],["Dimensions",a.dimensions],["Status",a.status]].filter(r=>r[1]);
  lb.innerHTML=`<div class="lb"><div class="stage" id="stage">${artBox({...a,src:a.src},{eager:true,sizes:"70vw"})}</div><aside><h2 style="font-size:2rem">${esc(a.title||"Untitled")}</h2>${rows.length?`<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>`:""}${a.description?`<p>${esc(a.description)}</p>`:""}
  <div class="navs"><button class="lbtn" data-n="-1" aria-label="Previous artwork">Previous</button><button class="lbtn" data-n="1" aria-label="Next artwork">Next</button></div><p class="muted" style="font-size:.8rem;margin:.8rem 0 0" aria-live="polite">${idx+1} of ${list.length}</p></aside><button class="lbtn close" data-close aria-label="Close artwork view">Close</button></div>`;
  const im=$("#stage .art"); if(im) im.style.cssText+=`;height:min(70vh,70vw*${a.h/a.w});aspect-ratio:${a.w}/${a.h}`;
}
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){last=o;show(+o.dataset.open);lb.showModal();$(".close",lb).focus();return}
  if(e.target.closest("[data-close]")||e.target===lb)lb.close();
  const n=e.target.closest("[data-n]"); if(n){show(idx+ +n.dataset.n);$(`[data-n="${n.dataset.n}"]`,lb)?.focus()}
  const f=e.target.closest("[data-f]"); if(f){filter=f.dataset.f;const y=scrollY;route();scrollTo(0,y);$(`[data-f="${CSS.escape(filter)}"]`)?.focus()}
});
lb.addEventListener("close",()=>last&&document.contains(last)?last.focus():0);
lb.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(idx+1);if(e.key==="ArrowLeft")show(idx-1)});
let sx=null;lb.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)show(idx+(d<0?1:-1));sx=null});
const tt=$("#tt");
function applyTheme(t){document.documentElement.dataset.theme=t;tt.setAttribute("aria-checked",t==="dark");tt.setAttribute("aria-label","Dark mode")}
function setTheme(t,save){
  if(save)try{localStorage.setItem("theme",t)}catch(e){}
  if(!document.startViewTransition||matchMedia("(prefers-reduced-motion:reduce)").matches){applyTheme(t);return}
  const b=tt.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2,R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(()=>applyTheme(t)).ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${R}px at ${x}px ${y}px)`]},{duration:650,easing:"ease-in-out",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
}
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
applyTheme(saved==="dark"?"dark":"light");
tt.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
$("#menu").onclick=()=>{const o=$("#nav-list").classList.toggle("open");$("#menu").setAttribute("aria-expanded",o)};
$("#copy").textContent=`© ${new Date().getFullYear()} ${SITE.name}`;
$("#flinks").innerHTML=`<li><a href="#/">Home</a></li><li><a href="#/about">About</a></li><li><a href="#/gallery">Gallery</a></li><li><a href="#/contact">Contact</a></li>`+SITE.socials.map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join("");
addEventListener("hashchange",route);route();
</script>
